<mat-card>
    <div class="image-container">
        <img mat-card-image [src]="profile_picture" alt="Jad Ghandour picture">
    </div>
    <div class="profile-info">
        <mat-card-content>
            <h1 class="job-title">Jad Ghandour - Ingénieur Logiciel</h1>
            <div>
                <p>{{presentation1}}</p>
                <p>{{presentation2}}</p>
                <p>{{presentation3}}</p>
            </div>
        </mat-card-content>
        <mat-card-actions>
            <div class="link-buttons">
                <a matButton="elevated" href="https://github.com/JadGhandourWork/" target="_blank">
                    <mat-icon svgIcon="github"></mat-icon>
                    GitHub
                </a>
                <a matButton="elevated" href="https://www.linkedin.com/in/jad-ghandour-290a49254/" target="_blank">
                    <mat-icon svgIcon="linkedin"></mat-icon>
                    LinkedIn
                </a>
            </div>
            <button matButton="elevated" target="_blank" class="contact-button">
                <mat-icon svgIcon="@"></mat-icon>
                Contact
            </button>
        </mat-card-actions>
    </div>
</mat-card>
<mat-card class="experiences">
    <mat-card-content>
        <h1></h1>
    </mat-card-content>
</mat-card>
